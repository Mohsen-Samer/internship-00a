<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My To-Do App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="card">
    <h1>📝 To-Do</h1>

    <form id="todo-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="What needs doing?" aria-label="New todo" />
      <button type="submit">Add</button>
    </form>

    <ul id="todo-list"></ul>

    <footer class="toolbar">
      <span id="todo-count">0 items left</span>
      <div class="filters" role="group" aria-label="Filter">
        <button class="filter active" data-filter="all">All</button>
        <button class="filter" data-filter="active">Active</button>
        <button class="filter" data-filter="done">Done</button>
      </div>
      <button id="clear-done" class="link">Clear done</button>
    </footer>

    <button id="load-samples" class="link bonus">⭐ Bonus: load samples from the internet</button>
  </main>

  <!-- type="module" lets app.js use `import` -->
  <script type="module" src="app.js"></script>
</body>
</html>
